      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
